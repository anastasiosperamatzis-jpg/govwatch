name: GovWatch

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: govwatch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Europe/Athens
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Write secret files
        env:
          TELEGRAM_TXT: ${{ secrets.TELEGRAM_TXT }}
          TELEGRAM_SYNTAXEIS_TXT: ${{ secrets.TELEGRAM_SYNTAXEIS_TXT }}
          CLOUDFLARE_TXT: ${{ secrets.CLOUDFLARE_TXT }}
        run: |
          [ -n "$TELEGRAM_TXT" ] && printf '%s\n' "$TELEGRAM_TXT" > telegram.txt
          [ -n "$TELEGRAM_SYNTAXEIS_TXT" ] && printf '%s\n' "$TELEGRAM_SYNTAXEIS_TXT" > telegram_syntaxeis.txt
          [ -n "$CLOUDFLARE_TXT" ] && printf '%s\n' "$CLOUDFLARE_TXT" > cloudflare.txt
          touch -d "$(cat last_upload_time.txt)" last_upload_time.txt || true
          true

      - name: Run GovWatch
        run: |
          M=$(date +%M)
          if [ $((10#$M % 30)) -lt 15 ]; then
            python monitor.py run
          else
            python -c "import monitor; monitor.run_once(only_fast=True)"
          fi

      - name: Save state
        run: |
          git config user.name "govwatch-bot"
          git config user.email "govwatch-bot@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "state $(date +'%Y-%m-%d %H:%M')"
            git pull --rebase -q || true
            git push
          fi
