name: Registry Bots

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

concurrency:
  group: registry-bots
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Europe/Athens
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run registry bots
        env:
          REGISTRY_TELEGRAM_TOKEN: ${{ secrets.REGISTRY_TELEGRAM_TOKEN }}
          REGISTRY_TELEGRAM_CHAT_ID: ${{ secrets.REGISTRY_TELEGRAM_CHAT_ID }}
        run: python run_registry.py

      - name: Save state
        run: |
          git config user.name "registry-bot"
          git config user.email "registry-bot@users.noreply.github.com"
          git add registry.db allages_hashes.json
          if ! git diff --cached --quiet; then
            git commit -m "registry $(date +'%Y-%m-%d %H:%M')"
            git pull --rebase -q || true
            git push
          fi
